name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts

      - name: Install Chromium and its system dependencies
        run: npx playwright-core install --with-deps --no-shell chromium

      - name: End-to-end tests
        run: npm run test:e2e

  e2e-oldest:
    name: End-to-end tests on the minimum Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_VERSION: 124.0.6367.207
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts

      - name: Install the system dependencies and the minimum Chrome
        run: |
          npx playwright-core install-deps chromium
          curl -fsSL "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip" -o chrome.zip
          unzip -q chrome.zip -d "$RUNNER_TEMP"

      - name: The manifest asks for this Chrome
        run: test "$(node -p "require('./manifest.json').minimum_chrome_version")" = "${CHROME_VERSION%%.*}"

      - name: End-to-end tests
        run: CHROME_PATH="$RUNNER_TEMP/chrome-linux64/chrome" npm run test:e2e
