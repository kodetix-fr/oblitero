name: Release

# An annotated tag v* publishes the extension package, a zip and its SHA-256, as a GitHub Release, with the section of
# CHANGELOG.md for that version as its notes. Uses the gh CLI shipped with the runner rather than a third-party action.
# Tag the merge commit on main once CI is green: a commit with no green CI run is not released.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

# Actions pinned to a commit; the comment carries the tag Dependabot tracks.
jobs:
  release:
    name: Build and publish the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The tag names the release and the zip carries the version of manifest.json: they must agree, with package.json too.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in manifest.json package.json; do
            version=$(node -p "require('./$file').version")
            if [ "$TAG" != "v$version" ]; then
              echo "Tag $TAG does not match the version $version of $file" >&2
              exit 1
            fi
          done
          kind=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)
          if [ "$kind" != "tag" ]; then
            echo "Tag $TAG is not annotated: delete it and create it again with git tag -a" >&2
            exit 1
          fi

      - name: CI is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          green=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$green" = "0" ]; then
            echo "No successful CI run for $GITHUB_SHA: wait for it, then re-run this job" >&2
            exit 1
          fi

      # The notes of the release are the section of the changelog for this version, without the links of the footer.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v heading="## [${TAG#v}]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found && /^\[[^]]+\]: / { next } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for ${TAG#v}" >&2
            exit 1
          fi

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint, types, unit tests
        run: npm run check

      - name: Package
        run: npm run package

      - name: Checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum "oblitero-${TAG#v}.zip" > "oblitero-${TAG#v}.zip.sha256"

      # Built before the release exists: a failed build leaves no empty release behind, and the job can simply be re-run.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish the package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "dist/oblitero-${TAG#v}.zip" "dist/oblitero-${TAG#v}.zip.sha256"
